name: Tone Dashboard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - run: bash scripts/check.sh
      - run: .venv/bin/pip install pip-audit && .venv/bin/pip-audit -r requirements.lock
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          swiftc apple/ToneDashboardApps/APIClient.swift apple/ToneDashboardApps/DashboardSession.swift apple/ToneDashboardApps/KeychainStore.swift apple/tests/ContainerTests.swift -o /tmp/container-tests
          /tmp/container-tests
          swiftc -parse-as-library apple/tests/OrbitCookiePersistenceTests.swift -o /tmp/cookie-tests
          /tmp/cookie-tests
      - run: xcodebuild -project apple/ToneDashboardApps.xcodeproj -scheme 'ToneDashboardApps macOS' -configuration Release -destination 'platform=macOS' -derivedDataPath /tmp/tone-macos-build CODE_SIGNING_ALLOWED=NO build
      - run: |
          codesign --force --sign - --options runtime '/tmp/tone-macos-build/Build/Products/Release/ToneDashboardApps.app'
          bash apple/verify-macos-app.sh '/tmp/tone-macos-build/Build/Products/Release/ToneDashboardApps.app'
      - run: xcodebuild -project apple/ToneDashboardApps.xcodeproj -scheme 'ToneDashboardApps iOS' -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m venv .venv
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-layouts
          path: test-results/browser
