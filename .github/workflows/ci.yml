name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python and shell validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python
        run: |
          python -m py_compile             emby_organizer.py             state_db.py             torrent_utils.py             scripts/log-viewer.py             scripts/telegram_torrent_bot.py             scripts/log-error-watcher.py             scripts/update_macos.py

      - name: Validate shell scripts
        run: |
          bash -n scripts/install-macos-services.sh
          bash -n scripts/status-macos.sh
          bash -n scripts/open-logs-macos.sh
          bash -n scripts/emby-watch-refresh.sh

      - name: Run tests
        run: python -m unittest discover -s tests -v
