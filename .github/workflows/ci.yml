name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: |
          python -m py_compile orbit_pairing.py download_security.py request_security.py emby_organizer.py state_db.py torrent_utils.py orbit_dashboard_proxy.py orbit_dashboard_control.py scripts/log-viewer.py scripts/telegram_torrent_bot.py scripts/log-error-watcher.py scripts/update_macos.py
          bash -n scripts/install-macos-services.sh
          bash -n scripts/status-macos.sh
          bash -n scripts/open-logs-macos.sh
          bash -n scripts/emby-watch-refresh.sh
      - run: python -m unittest discover -s tests -v
